# ---------------------------------------------------------------
# Perfil HTTPS: se activa con --spring.profiles.active=https
# ---------------------------------------------------------------
# El certificado incluido es autofirmado y sirve para el entorno local y para
# la demostracion. En produccion se reemplaza por el certificado emitido para
# el dominio de la empresa y la contrasena se entrega por variable de entorno.
server.port=${ROGGER_PUERTO_HTTPS:8443}

server.ssl.enabled=true
server.ssl.key-store=classpath:certificado/rogger-local.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ROGGER_KEYSTORE_PASS:roggerlocal}
server.ssl.key-alias=rogger
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# El front-end tambien se sirve por HTTPS cuando se usa este perfil.
app.cors.origenes=${ROGGER_CORS:https://localhost:4200,http://localhost:4200}

# Si el sistema queda detras de un proxy o balanceador, este ajuste permite que
# Spring reconozca el esquema original de la peticion.
server.forward-headers-strategy=framework
