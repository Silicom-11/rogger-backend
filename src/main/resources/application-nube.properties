# ---------------------------------------------------------------------------
# Perfil de produccion: se activa con SPRING_PROFILES_ACTIVE=nube
#
# Ningun valor sensible esta escrito aqui. Todos se leen de variables de
# entorno que se definen en el panel del proveedor de nube, de modo que el
# repositorio no publica credenciales.
# ---------------------------------------------------------------------------

# Cadena de conexion de MongoDB Atlas (incluye usuario y contrasena).
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Firma del token. Obligatoria: sin ella la aplicacion no arranca.
app.jwt.secret=${ROGGER_JWT_SECRET}
app.jwt.expiracion-minutos=${ROGGER_JWT_MINUTOS:60}
app.jwt.refresh-dias=${ROGGER_REFRESH_DIAS:7}

# Origen del front-end publicado.
app.cors.origenes=${ROGGER_CORS}

# Atlas se despliega como conjunto de replicas, de modo que las transacciones
# multi-documento si estan disponibles en este entorno.
app.transacciones.habilitadas=true

# Proteccion del acceso
app.seguridad.max-intentos=${ROGGER_MAX_INTENTOS:5}
app.seguridad.bloqueo-minutos=${ROGGER_BLOQUEO_MINUTOS:15}
app.seguridad.limite-por-minuto=${ROGGER_LIMITE_MINUTO:120}

# Avisos al cliente: sin pasarela contratada, quedan en la bitacora.
app.notificaciones.proveedor=${ROGGER_NOTIF_PROVEEDOR:registro}
app.notificaciones.url=${ROGGER_NOTIF_URL:}
app.notificaciones.token=${ROGGER_NOTIF_TOKEN:}
app.notificaciones.canal=${ROGGER_NOTIF_CANAL:SMS}
app.notificaciones.remitente=${ROGGER_NOTIF_REMITENTE:RoggerExp}
app.notificaciones.timeout-segundos=10
app.notificaciones.max-intentos=4
app.notificaciones.reintento-ms=180000

# La carga inicial solo se ejecuta si las colecciones estan vacias.
app.carga-inicial=true

# Detras del balanceador del proveedor, para que Spring reconozca el esquema
# original de la peticion y genere bien las URL.
server.forward-headers-strategy=framework

# Formato de fechas y zona horaria
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Documentacion interactiva
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
