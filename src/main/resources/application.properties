spring.application.name=rogger-express-api
server.port=8080

# ---------------------------------------------------------------
# Conexion con MongoDB (instancia local administrada con Compass)
# ---------------------------------------------------------------
spring.data.mongodb.uri=mongodb://localhost:27017/roggerexpress_db
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------
# Seguridad: firma y vigencia de los tokens
# ---------------------------------------------------------------
# En produccion debe definirse la variable de entorno ROGGER_JWT_SECRET.
# El valor de respaldo solo sirve para el entorno local de desarrollo.
app.jwt.secret=${ROGGER_JWT_SECRET:rogger-express-clave-local-de-desarrollo-hs512-no-usar-en-produccion-2026}

# El token de acceso dura poco; la sesion se mantiene con el token de refresco,
# que puede revocarse desde el servidor.
app.jwt.expiracion-minutos=${ROGGER_JWT_MINUTOS:60}
app.jwt.refresh-dias=${ROGGER_REFRESH_DIAS:7}

# ---------------------------------------------------------------
# Proteccion del acceso
# ---------------------------------------------------------------
# Intentos fallidos antes de bloquear temporalmente una cuenta.
app.seguridad.max-intentos=${ROGGER_MAX_INTENTOS:5}
app.seguridad.bloqueo-minutos=${ROGGER_BLOQUEO_MINUTOS:15}
# Solicitudes por minuto y por origen sobre los accesos publicos de la API.
app.seguridad.limite-por-minuto=${ROGGER_LIMITE_MINUTO:60}

# Origen permitido para el front-end Angular
app.cors.origenes=${ROGGER_CORS:http://localhost:4200}

# ---------------------------------------------------------------
# Avisos al cliente
# ---------------------------------------------------------------
# registro = solo bitacora local (sin costo, no contacta al cliente)
# http     = pasarela real de SMS / WhatsApp; requiere URL y token contratados
app.notificaciones.proveedor=${ROGGER_NOTIF_PROVEEDOR:registro}
app.notificaciones.url=${ROGGER_NOTIF_URL:}
app.notificaciones.token=${ROGGER_NOTIF_TOKEN:}
app.notificaciones.canal=${ROGGER_NOTIF_CANAL:SMS}
app.notificaciones.remitente=${ROGGER_NOTIF_REMITENTE:RoggerExp}
app.notificaciones.timeout-segundos=10
# Intentos totales por aviso y periodo del reintento automatico (3 minutos).
app.notificaciones.max-intentos=4
app.notificaciones.reintento-ms=180000

# ---------------------------------------------------------------
# Formato de fechas y zona horaria
# ---------------------------------------------------------------
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------
# Documentacion interactiva de la API (Swagger UI)
# ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Monitoreo
management.endpoints.web.exposure.include=health,info

# Carga de datos iniciales (agencias, tarifario y usuarios)
app.carga-inicial=true
